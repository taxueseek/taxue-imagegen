<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">踏雪生图元提示词库</title>
  <desc id="desc">三条赛道、四种工作流——把一句话、一个主题或一张照片，做成一张稳定的封面、群像或写实包装样机。</desc>

  <rect width="1200" height="280" rx="18" fill="#F4EEE4"/>
  <rect x="0" y="32" width="4" height="216" fill="#C3272B"/>

  <g transform="translate(56 36)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B8174" letter-spacing="6">生图元提示词库</text>
    <text x="0" y="68" font-family="Songti SC, STSong, Songti TC, Georgia, serif" font-size="44" fill="#2C2C2C">踏雪生图</text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="17" fill="#3A3530">三条赛道、四种工作流——把一句话、一个主题或一张照片，做成一张稳定的封面、群像或写实包装样机</text>

    <g transform="translate(0 132)">
      <rect width="108" height="28" rx="4" fill="#FAF6EE" stroke="#D4CBB8"/>
      <text x="54" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2C2C2C">A · 海报</text>
      <rect x="120" width="108" height="28" rx="4" fill="#FAF6EE" stroke="#D4CBB8"/>
      <text x="174" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2C2C2C">B · 群像</text>
      <rect x="240" width="108" height="28" rx="4" fill="#FAF6EE" stroke="#D4CBB8"/>
      <text x="294" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2C2C2C">C · 包装</text>
      <rect x="360" width="132" height="28" rx="4" fill="#FAF6EE" stroke="#D4CBB8"/>
      <text x="426" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C3272B">机械填槽 · 一次验收</text>
    </g>

    <g transform="translate(0 190)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="0" y="0" fill="#2C2C2C">槽位</text>
      <text x="42" y="0" fill="#C4B8A8">→</text>
      <text x="64" y="0" fill="#2C2C2C">预检</text>
      <text x="106" y="0" fill="#C4B8A8">→</text>
      <text x="128" y="0" fill="#2C2C2C">出图</text>
      <text x="170" y="0" fill="#C4B8A8">→</text>
      <text x="192" y="0" fill="#2C2C2C">量测 + 去水印</text>
      <text x="300" y="0" fill="#C4B8A8">→</text>
      <text x="322" y="0" fill="#2C2C2C">归档</text>
      <text x="364" y="0" fill="#C4B8A8">→</text>
      <text x="386" y="0" fill="#C3272B">模板迭代</text>
    </g>
  </g>
</svg>