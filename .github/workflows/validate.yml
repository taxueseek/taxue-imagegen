name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy + pillow + opencv
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow opencv-python-headless

      - name: Smoke import all scripts
        run: |
          set -e
          for f in scripts/*.py; do
            echo "import-check: $f"
            python -c "import importlib.util, sys, pathlib; \
              p = pathlib.Path('$f'); \
              spec = importlib.util.spec_from_file_location(p.stem, p); \
              m = importlib.util.module_from_spec(spec); \
              spec.loader.exec_module(m)" || {
                echo "  FAIL: $f did not import"
                exit 1
              }
          done

      - name: Run preflight on Track A template
        run: |
          python - <<'PY'
          import re, sys, subprocess, tempfile, os
          text = open("references/poster-v5.md", encoding="utf-8").read()
          m = re.search(r"^```\n(.*?)^```$", text, re.S | re.M)
          if not m:
              print("FAIL: poster-v5.md has no ``` fenced block"); sys.exit(1)
          body = m.group(1)
          print(f"OK: extracted Track A template, {len(body)} chars")
          with tempfile.NamedTemporaryFile("w", suffix=".txt", delete=False) as f:
              f.write(body); tmp = f.name
          try:
              r = subprocess.run(
                  [sys.executable, "scripts/preflight.py", tmp, "--track", "A"],
                  capture_output=True, text=True, timeout=20,
              )
              print("preflight rc:", r.returncode)
              if r.stdout.strip():
                  for line in r.stdout.strip().splitlines()[:8]:
                      print("  >", line)
              if r.returncode not in (0, 1):
                  print("FAIL: preflight returned", r.returncode); sys.exit(1)
              print("OK: preflight ran without error")
          finally:
              os.unlink(tmp)
          PY

      - name: Verify SKILL.md front-matter
        run: |
          python - <<'PY'
          import re, sys
          with open("SKILL.md", encoding="utf-8") as f:
              head = f.read(2048)
          m = re.match(r"^---\n(.*?)\n---\n", head, re.S)
          if not m:
              print("FAIL: SKILL.md missing front-matter"); sys.exit(1)
          fm = m.group(1)
          for key in ("name:", "description:"):
              if key not in fm:
                  print(f"FAIL: SKILL.md front-matter missing {key}"); sys.exit(1)
          print("OK: SKILL.md front-matter valid")
          PY

      - name: Check critical files exist
        run: |
          test -f README.md
          test -f README.en.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f ASSET-LICENSE.md
          test -f scripts/run_tests.sh
          echo "OK: critical files present"

      - name: Check JSON syntax (none expected, but guard future)
        run: |
          find . -path ./.git -prune -o -name '*.json' -print | xargs -I{} sh -c 'python -m json.tool "{}" >/dev/null && echo "OK {}"' 2>&1 | head -10 || echo "no JSON files (OK)"