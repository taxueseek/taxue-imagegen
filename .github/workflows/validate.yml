name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numpy + pillow + opencv
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow opencv-python-headless

      # Single source of truth: the same suite contributors run locally.
      # It covers import-check, SKILL.md front-matter, preflight, critical
      # files, hero asset, and the privacy scan for machine-local paths.
      - name: Run test suite
        run: bash scripts/run_tests.sh

      - name: Check JSON syntax (none expected, but guard future)
        run: |
          find . -path ./.git -prune -o -name '*.json' -print | xargs -I{} sh -c 'python -m json.tool "{}" >/dev/null && echo "OK {}"' 2>&1 | head -10 || echo "no JSON files (OK)"
